<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halloween Word Challenge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at top, #252525 0%, #111 45%, #050505 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 34px 28px 30px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .eyebrow {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 700;
      color: #ff9500;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
      margin: 0;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.65);
      font-size: 16px;
      margin: 14px auto 28px;
      line-height: 1.5;
      max-width: 500px;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin: 0 auto 30px;
      max-width: 560px;
    }

    .tile {
      width: 55px;
      height: 55px;
      background: linear-gradient(145deg, #f7f7f7, #d9d9d9);
      color: #111;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      box-shadow:
        0 5px 12px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.9);
      position: relative;
    }

    .tile-value {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 9px;
      font-weight: 700;
      opacity: 0.55;
    }

    .instruction {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 24px;
    }

    .only-one {
      color: #ff9500;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 56px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      padding: 0 17px;
      font-size: 17px;
      outline: none;
      margin-bottom: 12px;
      -webkit-appearance: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    input:focus {
      border-color: #ff9500;
      box-shadow: 0 0 0 3px rgba(255,149,0,0.15);
    }

    button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 15px;
      background: #ff9500;
      color: #111;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .message {
      min-height: 24px;
      text-align: center;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 600;
    }

    .winner-screen {
      text-align: center;
      padding: 15px 0 10px;
    }

    .winner-icon {
      font-size: 64px;
      margin-bottom: 10px;
    }

    .winner-title {
      font-size: clamp(38px, 9vw, 64px);
      font-weight: 900;
      letter-spacing: -2px;
      margin: 0 0 12px;
      line-height: 1;
    }

    .winner-name {
      font-size: 28px;
      font-weight: 800;
      color: #ff9500;
      margin: 8px 0 22px;
    }

    .winning-word {
      display: inline-block;
      letter-spacing: 6px;
      font-size: clamp(28px, 7vw, 46px);
      font-weight: 900;
      margin: 8px 0 28px;
    }

    .winner-message {
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .reveal {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 24px;
      margin-top: 8px;
    }

    .reveal-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .people {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      text-align: left;
    }

    .person {
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .person-letter {
      font-weight: 900;
      color: #ff9500;
      font-size: 18px;
    }

    .extra-o {
      margin-top: 10px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
    }

    .loading {
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .game-card {
        padding: 28px 18px 24px;
        border-radius: 22px;
      }

      .tile {
        width: 45px;
        height: 45px;
        font-size: 21px;
      }

      .tiles {
        gap: 7px;
      }

      .people {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="game-card" id="gameCard">

    <div class="eyebrow">DHL Cross Border × IT</div>

    <h1>Halloween<br>Word Challenge</h1>

    <div class="subtitle">
      One word. One winner.
    </div>

    <div class="tiles">

      <div class="tile">H<span class="tile-value">4</span></div>
      <div class="tile">O<span class="tile-value">1</span></div>
      <div class="tile">G<span class="tile-value">2</span></div>
      <div class="tile">S<span class="tile-value">1</span></div>
      <div class="tile">W<span class="tile-value">4</span></div>
      <div class="tile">E<span class="tile-value">1</span></div>
      <div class="tile">K<span class="tile-value">5</span></div>
      <div class="tile">O<span class="tile-value">1</span></div>
      <div class="tile">R<span class="tile-value">1</span></div>
      <div class="tile">M<span class="tile-value">3</span></div>
      <div class="tile">H<span class="tile-value">4</span></div>
      <div class="tile">G<span class="tile-value">2</span></div>
      <div class="tile">S<span class="tile-value">1</span></div>
      <div class="tile">V<span class="tile-value">4</span></div>

    </div>

    <div class="instruction">
      Enter the largest word you can create from these letters.<br>
      <span class="only-one">Only one word wins the game.</span>
    </div>

    <input
      type="text"
      id="name"
      placeholder="Your name"
      maxlength="60"
      autocomplete="name"
    >

    <input
      type="text"
      id="word"
      placeholder="Enter your word"
      maxlength="30"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button id="submitButton" onclick="submitWord()">
      Submit Word
    </button>

    <div class="message" id="message"></div>

    <div class="loading" id="loading">
      Checking game status...
    </div>

  </div>
</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbyi1UrD3g8dZERfifG1c7doFiqtidaPax-F4fsrhIR29tLkMppUtNYIFvwLk42hKA_X/exec";


/* ---------------------------------------------------------
   PEOPLE REVEAL
--------------------------------------------------------- */

const people = [
  ["S", "Adam", "S"],
  ["S", "Andrea", "S"],
  ["O", "Andres", "O"],
  ["W", "Anna", "W"],
  ["H", "Ayube", "H"],
  ["E", "Chiric", "E"],
  ["G", "Daniel", "G"],
  ["K", "Daniel", "K"],
  ["H", "Fabiana", "H"],
  ["R", "Juan", "R"],
  ["M", "Marisa", "M"],
  ["G", "Monica", "G"],
  ["V", "Raul", "V"]
];


/* ---------------------------------------------------------
   CHECK GAME STATUS
--------------------------------------------------------- */

async function checkGameStatus() {

  try {

    const response = await fetch(
      API_URL + "?t=" + Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const result = await response.json();

    console.log("Game status:", result);

    document.getElementById("loading").style.display = "none";

    if (
      result.ok === true &&
      result.gameOver === true &&
      result.winner
    ) {

      showWinner(result.winner);

      return true;
    }

    return false;

  } catch (error) {

    console.error("Status check failed:", error);

    document.getElementById("loading").textContent =
      "Unable to check game status.";

    return false;
  }
}


/* ---------------------------------------------------------
   SUBMIT WORD
--------------------------------------------------------- */

async function submitWord() {

  const name =
    document.getElementById("name").value.trim();

  const word =
    document.getElementById("word").value.trim().toUpperCase();

  const button =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");


  if (!name) {

    message.textContent =
      "Please enter your name.";

    return;
  }


  if (!word) {

    message.textContent =
      "Please enter a word.";

    return;
  }


  button.disabled = true;

  button.textContent = "Checking...";

  message.textContent = "";


  try {

    const response = await fetch(
      API_URL,
      {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          name: name,
          word: word
        })
      }
    );


    const result = await response.json();

    console.log("Submission result:", result);


    if (result.gameOver === true) {

      showWinner(result.winner);

      return;
    }


    if (
      result.ok === true &&
      result.winner === true
    ) {

      showWinner(result.name);

      return;
    }


    message.textContent =
      result.message ||
      "Not the largest word. Try again!";


    button.disabled = false;

    button.textContent = "Submit Word";


  } catch (error) {

    console.error("Submission error:", error);

    message.textContent =
      "Something went wrong. Please try again.";

    button.disabled = false;

    button.textContent = "Submit Word";
  }
}


/* ---------------------------------------------------------
   WINNER SCREEN
--------------------------------------------------------- */

function showWinner(winnerName) {

  const card =
    document.getElementById("gameCard");


  const peopleHTML =
    people.map(function(person) {

      const letter = person[0];
      const firstName = person[1];
      const lastInitial = person[2];

      return `
        <div class="person">
          <span>${firstName} ${lastInitial}.</span>
          <span class="person-letter">${letter}</span>
        </div>
      `;

    }).join("");


  card.innerHTML = `

    <div class="winner-screen">

      <div class="eyebrow">
        DHL Cross Border × IT
      </div>

      <div class="winner-icon">
        🎃
      </div>

      <h1 class="winner-title">
        WE HAVE A WINNER
      </h1>

      <div class="winner-name">
        ${escapeHTML(winnerName)}
      </div>

      <div class="winning-word">
        HOMEWORK
      </div>

      <div class="winner-message">
        Congratulations! You found the only<br>
        word that wins the game.
      </div>

      <div class="reveal">

        <div class="reveal-title">
          Where did the letters come from?
        </div>

        <div class="people">
          ${peopleHTML}
        </div>

        <div class="extra-o">
          + One extra O for a little Halloween mystery.
        </div>

      </div>

    </div>
  `;
}


/* ---------------------------------------------------------
   BASIC HTML ESCAPING
--------------------------------------------------------- */

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ---------------------------------------------------------
   ENTER KEY SUPPORT
--------------------------------------------------------- */

document
  .getElementById("word")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      submitWord();
    }

  });


/* ---------------------------------------------------------
   INITIAL STATUS CHECK
--------------------------------------------------------- */

checkGameStatus();


/* ---------------------------------------------------------
   AUTOMATIC WINNER DETECTION
   Checks every 2 seconds
--------------------------------------------------------- */

setInterval(function() {

  checkGameStatus();

}, 2000);

</script>

</body>
</html>
